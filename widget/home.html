<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#080313;color:#fff;font:14px system-ui,-apple-system,sans-serif}.wrap{padding:9px;background:radial-gradient(ellipse at 50% 28%,#321064 0,#10051f 48%,#07020f 100%);border:1px solid #8b2cff;border-radius:18px;box-shadow:0 0 18px #9b27ff88}.top{display:flex;align-items:center;justify-content:space-between;gap:6px}.brand{font-weight:1000;font-size:19px;font-style:italic;letter-spacing:1px;color:#fff;text-shadow:0 0 8px #c45cff}.online{font-size:10px;color:#6effbd;border:1px solid #7930bd;border-radius:30px;padding:5px 8px}.avatar{width:35px;height:35px;border-radius:50%;border:2px solid #d34bff;background:linear-gradient(135deg,#251047,#080313);display:grid;place-items:center;font-size:21px}.royal{margin:10px 0 8px;text-align:center;border:1px solid #b348ff;border-radius:13px;padding:7px;background:linear-gradient(110deg,#17072c,#38116c,#13051f);color:#ffd66d;font-family:Georgia,serif;font-weight:bold;letter-spacing:2px;text-shadow:0 0 9px #ffb83e}.headline{text-align:center;font-size:20px;font-weight:900;font-style:italic;color:#fff;text-shadow:0 0 9px #b32cff}.sub{text-align:center;color:#d9c9f7;font-size:11px;margin:2px 0 8px}.board{position:relative;margin:7px auto 9px;width:min(100%,250px);aspect-ratio:1.6;border:3px solid #b77bff;border-radius:16px;padding:8px;background:linear-gradient(135deg,#21103c,#090513);box-shadow:0 0 18px #a52cff99}.grid{height:100%;display:grid;grid-template:repeat(6,1fr)/repeat(6,1fr);gap:2px;transform:perspective(500px) rotateX(4deg)}.cell{border:1px solid #b9a5d6;background:#f7f0ff;min-width:0}.r{background:#ff4c69}.g{background:#40d77b}.y{background:#ffcf42}.b{background:#48a9ff}.center{grid-area:3/3/5/5;background:conic-gradient(#ff405f 0 25%,#ffce36 0 50%,#32d779 0 75%,#398dff 0);display:grid;place-items:center;font-size:28px;text-shadow:0 2px 4px #111}.pawn{position:absolute;font-size:23px;filter:drop-shadow(0 2px 2px #000)}.p1{top:19%;left:15%}.p2{top:19%;right:15%}.p3{bottom:15%;left:15%}.p4{bottom:15%;right:15%}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}.stat{border:1px solid #a63cff;border-radius:10px;padding:7px;background:#170a2c;text-align:center}.stat small{display:block;color:#d7c4fa;font-size:10px}.stat strong{font-size:18px;color:#ffd66d}.cards{display:grid;grid-template-columns:1fr 1fr;gap:7px}.card{border:1px solid #a638ff;border-radius:12px;background:linear-gradient(130deg,#271044,#10051f);min-height:48px;padding:8px 5px;color:white;text-align:center;font-weight:800;font-size:12px;text-shadow:0 0 6px #a72dff;box-shadow:inset 0 0 12px #7d20bb33}.card .ico{font-size:21px;display:block;margin-bottom:2px}.card:active{background:#482071}.wide{grid-column:1/-1;min-height:36px}.nav{display:grid;grid-template-columns:repeat(4,1fr);margin-top:9px;border-top:1px solid #7030a5;padding-top:7px}.nav button{border:0;background:transparent;color:#c9a9f7;font-size:10px;padding:5px 0}.nav b{display:block;font-size:19px}.nav .active{color:#fff;text-shadow:0 0 10px #c42cff}.foot{text-align:center;color:#ffd36b;font-size:10px;margin-top:4px}#status{text-align:center;color:#e9d6ff;font-size:10px;min-height:13px;margin-top:3px}
</style></head><body><main class="wrap"><header class="top"><div class="brand">👑 LUDO ARENA</div><div class="online">🟢 ARENA ONLINE</div><div class="avatar">👑</div></header><div class="royal">♛ THE ROYAL BOARD ♛</div><div class="headline">Your arena. Your victory.</div><div class="sub">Roll in. Rise up. Rule the board.</div><section class="board"><div class="grid"><i class="cell r"></i><i class="cell r"></i><i class="cell"></i><i class="cell g"></i><i class="cell g"></i><i class="cell g"></i><i class="cell r"></i><i class="cell r"></i><i class="cell"></i><i class="cell g"></i><i class="cell g"></i><i class="cell g"></i><i class="cell"></i><i class="cell"></i><i class="cell"></i><i class="cell"></i><i class="cell"></i><i class="cell"></i><i class="cell y"></i><i class="cell y"></i><i class="cell"></i><i class="cell"></i><i class="cell b"></i><i class="cell b"></i><i class="cell y"></i><i class="cell y"></i><i class="cell"></i><i class="cell"></i><i class="cell b"></i><i class="cell b"></i><i class="cell y"></i><i class="cell y"></i><i class="cell"></i><i class="cell"></i><i class="cell b"></i><i class="cell b"></i><div class="center">🎲</div></div><span class="pawn p1">🔴</span><span class="pawn p2">🟢</span><span class="pawn p3">🟡</span><span class="pawn p4">🔵</span></section><div class="stats"><div class="stat"><small>🪙 YOUR COINS</small><strong id="coins">0</strong></div><div class="stat"><small>🏆 YOUR WINS</small><strong id="wins">0</strong></div></div><section class="cards"><button class="card" data-a="solo"><span class="ico">🛡️</span>PLAY SOLO<small>Challenge AI</small></button><button class="card" data-a="friends"><span class="ico">👥</span>PLAY WITH FRIENDS<small>Private room</small></button><button class="card" data-a="random"><span class="ico">🎲</span>RANDOM MATCH<small>Find opponent</small></button><button class="card" data-a="ranks"><span class="ico">🏆</span>LEADERBOARD<small>Top players</small></button><button class="card" data-a="profile"><span class="ico">👤</span>PROFILE<small>Your stats & info</small></button><button class="card" data-a="rewards"><span class="ico">🎁</span>DAILY REWARDS<small>Claim bonus</small></button><button class="card wide" data-a="settings">⚙️ SETTINGS</button><button class="card wide" data-a="help">❔ HELP & RULES</button></section><nav class="nav"><button class="active" data-a="home"><b>⌂</b>HOME</button><button data-a="play"><b>🎮</b>PLAY</button><button data-a="ranks"><b>🏆</b>RANKS</button><button data-a="profile"><b>♙</b>PROFILE</button></nav><div class="foot">♛ GOOD LUCK & HAPPY GAMING ♛</div><div id="status"></div></main><script>
(function(){var d={};try{d=JSON.parse(TelegramWidget.chatData||'{}')}catch(e){}document.getElementById('coins').textContent=d.coins||0;document.getElementById('wins').textContent=d.wins||0;document.querySelectorAll('[data-a]').forEach(function(b){b.addEventListener('click',function(){var a=b.getAttribute('data-a');if(TelegramWidget&&TelegramWidget.request){var s=document.getElementById('status');s.textContent='Sending…';TelegramWidget.request(a).then(function(r){s.textContent=(r&&r.result)||'Done';}).catch(function(e){s.textContent='Could not send: '+(e.code||'ERROR');})}})})})();
</script></body></html>
